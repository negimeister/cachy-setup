---
- name: Install pipewire-jack (replaces jack)
  pacman:
    name:
      - pipewire-jack
    state: present
    extra_args: --ask=4
  become: yes

- name: Ensure GUI apps are installed
  pacman:
    name:
      - alacritty
      - android-tools
      - cachyos-gaming-meta
      - chromium
      - code
      - darktable
      - eog
      - fcitx5
      - fcitx5-configtool
      - fcitx5-gtk
      - fcitx5-mozc
      - fcitx5-qt
      - file-roller
      - freecad
      - gimp
      - hyprshot
      - inkscape
      - kitty
      - lemonade-desktop
      - meld
      - mixxx
      - obs-studio
      - octopi
      - openscad
      - pcmanfm
      - picard
      - prusa-slicer
      - pulseview
      - scrcpy
      - solaar
      - sqlitebrowser
      - virt-manager
      - vlc
      - wireshark-qt
      - wofi
      - yakuake
      - yt-dlp
    state: present
  become: yes
 
