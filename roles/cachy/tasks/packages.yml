---
- name: Update package cache
  pacman:
    update_cache: yes
  become: yes

- name: Upgrade system packages
  pacman:
    upgrade: yes
  become: yes

- name: Ensure required packages are installed
  pacman:
    name:
      - android-udev
      - ansible
      - ansible-lint
      - arm-none-eabi-binutils
      - arm-none-eabi-gcc
      - arm-none-eabi-gdb
      - arm-none-eabi-newlib
      - aws-cli-v2
      - azure-cli
      - azure-kubelogin
      - base-devel
      - bash-completion
      - bc
      - bind
      - bluetui
      - btop
      - chezmoi
      - cilium-cli
      - claude-code
      - cmake
      - copyparty
      - curl
      - dfu-util
      - diffutils
      - diskonaut
      - duf
      - esptool
      - fastfetch
      - fastflowlm
      - findutils
      - flatpak
      - framework-system
      - git
      - git-zsh-completion
      - github-cli
      - glances
      - glibc
      - gnupg
      - go
      - helm
      - inetutils
      - iotop
      - iperf3
      - iputils
      - jdk21-openjdk
      - jq
      - k9s
      - keyutils
      - kubectl
      - kubetui
      - lemonade-server
      - less
      - libdvdcss
      - llama-cpp
      - lsof
      - man-db
      - man-pages
      - maven
      - mesa
      - micro
      - mosquitto
      - mtr
      - nano
      - nano-syntax-highlighting
      - ncurses
      - nmap
      - npm
      - nss-mdns
      - openai-codex
      - openbsd-netcat
      - opencode
      - openocd
      - openssh
      - osc2midi
      - parallel
      - paru
      - picocom
      - pigz
      - pinentry
      - pkgfile
      - plocate
      - postgresql
      - probe-rs
      - procps-ng
      - pv
      - python-docker
      - python-flask
      - python-hidapi
      - python-kubernetes
      - python-packaging
      - python-pipx
      - python-requests
      - realtime-privileges
      - ripgrep
      - rsync
      - rustup
      - shadow
      - sigrok-firmware-fx2lafw
      - snapper
      - sox
      - sshfs
      - starship
      - stlink
      - sudo
      - tailscale
      - tcpdump
      - time
      - tmux
      - traceroute
      - tree
      - tzdata
      - unzip
      - util-linux
      - util-linux-libs
      - vim
      - vlc-plugins-all
      - vte-common
      - vulkan-intel
      - vulkan-radeon
      - wget
      - whisper-cpp
      - words
      - xorg-xauth
      - yay
      - zip
      - zoxide
      - zsh
      - zsh-autocomplete
      - zsh-autosuggestions
      - zsh-completions
      - zsh-history-substring-search
      - zsh-syntax-highlighting
    state: present
    update_cache: yes
  become: yes

- name: Install CLI apps
  import_tasks: cli_apps.yml

- name: Install GUI apps
  import_tasks: gui_apps.yml

- name: Ensure yay is installed
  import_tasks: yay.yml

- name: Install AUR apps
  import_tasks: aur_apps.yml

- name: Install GUI AUR apps
  import_tasks: gui_aur_apps.yml

- name: Change Default Shell to Zsh
  user:
    name: "{{ ansible_user }}"
    shell: /usr/bin/zsh
  become: true

- name: Ensure host and distrobox users are in uucp group
  user:
    name: "{{ item }}"
    groups: uucp
    append: yes
  loop: "{{ [ansible_user, distrobox_user]|unique }}"
  become: yes
