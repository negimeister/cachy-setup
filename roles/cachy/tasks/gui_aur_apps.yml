- name: Report failed GUI AUR packages
  vars:
    gui_aur_failed: "{{ (gui_aur_apps_install_zoom.results + gui_aur_apps_install_openlens.results + gui_aur_apps_install_jetbrains.results + gui_aur_apps_install_ai.results + gui_aur_apps_install_slicers.results + gui_aur_apps_install_emulators.results + gui_aur_apps_install_keyboard.results + gui_aur_apps_install_notes.results + gui_aur_apps_install_creative.results + gui_aur_apps_install_remote.results + gui_aur_apps_install_browser.results + gui_aur_apps_install_desktop.results) | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"
  debug:
    msg: "GUI AUR packages that FAILED to install ({{ gui_aur_failed | length }}): {{ gui_aur_failed | join(', ') if gui_aur_failed else 'none — all installed successfully' }}"
