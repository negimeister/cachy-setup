---
- name: Ensure GUI AUR apps are installed (communications)
  command: >
    yay -S --needed --noconfirm --sudoflags=-n --answerclean=all --answerdiff=no {{ item }}
  loop:
    - zoom
  register: gui_aur_apps_install_zoom
  failed_when: false
  changed_when: gui_aur_apps_install_zoom.rc == 0 and 'there is nothing to do' not in (gui_aur_apps_install_zoom.stdout | default('') | lower)
  become: yes
  become_user: "{{ ansible_user }}"
  loop_control:
    label: "{{ item }}"

