- name: Ensure AUR apps are installed (infra and remote management)
  command: >
    yay -S --needed --noconfirm --sudoflags=-n --answerclean=all --answerdiff=no {{ item }}
  loop:
    - badfish
    - ryzenadj
    - supermicro-update-manager
  register: aur_apps_install_infra
  failed_when: false
  changed_when: aur_apps_install_infra.rc == 0 and 'there is nothing to do' not in (aur_apps_install_infra.stdout | default('') | lower)
  become: yes
  become_user: "{{ ansible_user }}"
