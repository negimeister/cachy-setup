- name: Ensure AUR apps are installed (misc)
  command: >
    yay -S --needed --noconfirm --sudoflags=-n --answerclean=all --answerdiff=no {{ item }}
  loop:
    - 1password-cli
    - kdotool-bin
    - wordle-cli-bin
  register: aur_apps_install_misc
  failed_when: false
  changed_when: aur_apps_install_misc.rc == 0 and 'there is nothing to do' not in (aur_apps_install_misc.stdout | default('') | lower)
  become: yes
  become_user: "{{ ansible_user }}"
  loop_control:
    label: "{{ item }}"

- name: Report failed AUR packages
  vars:
    aur_failed: "{{ (aur_apps_install_dev.results + aur_apps_install_gaming.results + aur_apps_install_peripherals.results + aur_apps_install_libs.results + aur_apps_install_infra.results + aur_apps_install_misc.results) | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"
  debug:
    msg: "AUR packages that FAILED to install ({{ aur_failed | length }}): {{ aur_failed | join(', ') if aur_failed else 'none — all installed successfully' }}"
