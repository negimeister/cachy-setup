---
- name: Ensure AUR apps are installed (dev tools)
  command: >
    yay -S --needed --noconfirm --sudoflags=-n --answerclean=all --answerdiff=no {{ item }}
  loop:
    - acli-bin
    - apache-tools
    - browser-use-cli
    - gitlint
    - hubble-bin
    - kcat-cli
    - maestro-bin
    - picotool
    - rustfs-cli-bin
  register: aur_apps_install_dev
  failed_when: false
  changed_when: aur_apps_install_dev.rc == 0 and 'there is nothing to do' not in (aur_apps_install_dev.stdout | default('') | lower)
  become: yes
  become_user: "{{ ansible_user }}"
  loop_control:
    label: "{{ item }}"

- name: Ensure AUR apps are installed (gaming)
  command: >
    yay -S --needed --noconfirm --sudoflags=-n --answerclean=all --answerdiff=no {{ item }}
  loop:
    - proton-ge-custom-bin
  register: aur_apps_install_gaming
  failed_when: false
  changed_when: aur_apps_install_gaming.rc == 0 and 'there is nothing to do' not in (aur_apps_install_gaming.stdout | default('') | lower)
