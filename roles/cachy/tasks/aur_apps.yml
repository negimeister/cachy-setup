    - python-redfish
    - python-sounddevice
  register: aur_apps_install_libs
  failed_when: false
  changed_when: aur_apps_install_libs.rc == 0 and 'there is nothing to do' not in (aur_apps_install_libs.stdout | default('') | lower)
  become: yes
  become_user: "{{ ansible_user }}"
