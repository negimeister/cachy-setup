---
- name: Ensure AUR apps are installed (dev tools)
  command: >
    yay -S --needed --noconfirm --sudoflags=-n --answerclean=all --answerdiff=no
    acli-bin apache-tools browser-use-cli gitlint hubble-bin kcat-cli maestro-bin picotool rustfs-cli-bin
  register: aur_apps_install_dev
  changed_when: >
    aur_apps_install_dev.rc == 0 and
    'there is nothing to do' not in (aur_apps_install_dev.stdout | default('') | lower)
  become: yes
  become_user: "{{ ansible_user }}"

